<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Subtle depth) -->
    <radialGradient id="bgDepth" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Blue Brand Gradient (Glowing high-tech) -->
    <linearGradient id="blueGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Silver Metallic Gradient -->
    <linearGradient id="silverGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="40%" stop-color="#cbd5e1" />
      <stop offset="70%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Separator Line Glow Gradient -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0" />
    </linearGradient>

    <!-- Glow Effect filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- Subtle Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Clean dark background card canvas (can be transparent, but self-contained background matches the uploaded image vibe perfectly) -->
  <rect width="512" height="512" rx="40" fill="url(#bgDepth)" />

  <!-- Outer circular glowing arc (representing analysis orbit) -->
  <path d="M 155 220 A 110 110 0 1 1 357 220" fill="none" stroke="url(#blueGrad)" stroke-width="14" stroke-linecap="round" filter="url(#glow)" />
  <path d="M 155 220 A 110 110 0 1 1 357 220" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.3" />

  <!-- The Bar Chart Columns -->
  <!-- Left Column -->
  <rect x="195" y="165" width="20" height="45" rx="5" fill="url(#blueGrad)" filter="url(#shadow)" />
  <!-- Middle Column -->
  <rect x="227" y="130" width="20" height="80" rx="5" fill="url(#blueGrad)" filter="url(#shadow)" />
  <!-- Right Column -->
  <rect x="259" y="90" width="20" height="120" rx="5" fill="url(#blueGrad)" filter="url(#shadow)" />

  <!-- Upward Trend Line & Arrow -->
  <line x1="205" y1="165" x2="305" y2="65" stroke="#ffffff" stroke-width="7" stroke-linecap="round" filter="url(#glow)" />
  <line x1="205" y1="165" x2="305" y2="65" stroke="#ffffff" stroke-width="7" stroke-linecap="round" />
  
  <!-- Trend Line Nodes -->
  <circle cx="205" cy="165" r="7" fill="#ffffff" stroke="#2563eb" stroke-width="3" />
  <circle cx="237" cy="130" r="7" fill="#ffffff" stroke="#2563eb" stroke-width="3" />
  <circle cx="269" cy="90" r="7" fill="#ffffff" stroke="#2563eb" stroke-width="3" />
  
  <!-- Glowing arrowhead -->
  <path d="M 285 65 L 305 65 L 305 85" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Main "K.A.S" typography in silver metallic gradient -->
  <text x="256" y="340" font-family="'Inter', 'Space Grotesk', system-ui, -apple-system, sans-serif" font-weight="900" font-size="105" letter-spacing="6" fill="url(#silverGrad)" text-anchor="middle" filter="url(#shadow)">K.A.S</text>

  <!-- Slogan "KURUM ANALİZ SİSTEMLERİ" -->
  <text x="256" y="412" font-family="'Inter', 'Space Grotesk', system-ui, -apple-system, sans-serif" font-weight="800" font-size="14" letter-spacing="5.5" fill="#38bdf8" text-anchor="middle">KURUM ANALİZ SİSTEMLERİ</text>

  <!-- Glowing Separator Line -->
  <line x1="80" y1="445" x2="432" y2="445" stroke="url(#lineGrad)" stroke-width="4" stroke-linecap="round" filter="url(#glow)" />
</svg>
