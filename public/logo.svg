<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Sleek deep space tech) -->
    <radialGradient id="bgDepth" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Metallic/Glowing Letter Gradient -->
    <linearGradient id="letterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#e2e8f0" />
      <stop offset="75%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Glowing Dot Gradient (Cyan Tech LED) -->
    <radialGradient id="dotGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#0891b2" />
    </radialGradient>

    <!-- Glowing Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#2563eb" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.8" />
    </linearGradient>

    <!-- Cyberpunk Soft Glow Effect -->
    <filter id="cyberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComponentTransfer in="blur" result="glow">
        <feFuncA type="linear" slope="0.6"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Text/Path Drop Shadow -->
    <filter id="heavyShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Base rounded-square squircle background (iOS-style icon shape) -->
  <rect width="512" height="512" rx="112" fill="url(#bgDepth)" />

  <!-- Outer Tech HUD Circular/Symmetrical Glow Frame (represents AI/Analysis systems) -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#borderGrad)" stroke-width="3" opacity="0.45" />
  <circle cx="256" cy="256" r="236" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.2" />

  <!-- Outer corner glow arcs -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="url(#borderGrad)" stroke-width="4" opacity="0.3" />

  <!-- Glowing Geometric "K.A.S" Letters (Symmetric custom futuristic glyph paths) -->
  <g filter="url(#heavyShadow)">
    <g filter="url(#cyberGlow)">
      <!-- K: Custom bold geometric pathways -->
      <line x1="95" y1="176" x2="95" y2="336" stroke="url(#letterGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
      <line x1="95" y1="260" x2="170" y2="176" stroke="url(#letterGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
      <line x1="120" y1="230" x2="170" y2="336" stroke="url(#letterGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />

      <!-- Dot 1: Cyan Tech Glowing LED -->
      <circle cx="191" cy="336" r="12" fill="url(#dotGrad)" filter="url(#heavyShadow)" />

      <!-- A: Geometric triangle form -->
      <path d="M 211 336 L 256 176 L 301 336" fill="none" stroke="url(#letterGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
      <line x1="231" y1="290" x2="281" y2="290" stroke="url(#letterGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />

      <!-- Dot 2: Cyan Tech Glowing LED -->
      <circle cx="322" cy="336" r="12" fill="url(#dotGrad)" filter="url(#heavyShadow)" />

      <!-- S: Custom cybernetic block wave path -->
      <path d="M 432 176 L 352 176 L 352 256 L 432 256 L 432 336 L 352 336" fill="none" stroke="url(#letterGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <!-- Glowing bottom indicator / brand bar -->
  <line x1="160" y1="410" x2="352" y2="410" stroke="url(#borderGrad)" stroke-width="4" stroke-linecap="round" opacity="0.7" filter="url(#cyberGlow)" />
  
  <!-- Subtitle for maximum brand authority -->
  <text x="256" y="445" font-family="'Space Grotesk', 'Inter', system-ui, -apple-system, sans-serif" font-weight="900" font-size="14" letter-spacing="8" fill="#38bdf8" text-anchor="middle" opacity="0.9">KURUM ANALİZ</text>
</svg>
