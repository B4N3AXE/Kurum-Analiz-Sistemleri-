<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Blue Brand Gradient (Glowing high-tech) -->
    <linearGradient id="blueGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Glow Effect filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- Subtle Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer circular glowing arc (representing analysis orbit) -->
  <path d="M 125 315 A 160 160 0 1 1 387 315" fill="none" stroke="url(#blueGrad)" stroke-width="20" stroke-linecap="round" filter="url(#glow)" />
  <path d="M 125 315 A 160 160 0 1 1 387 315" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.3" />

  <!-- The Bar Chart Columns -->
  <!-- Left Column -->
  <rect x="180" y="240" width="30" height="70" rx="8" fill="url(#blueGrad)" filter="url(#shadow)" />
  <!-- Middle Column -->
  <rect x="230" y="190" width="30" height="120" rx="8" fill="url(#blueGrad)" filter="url(#shadow)" />
  <!-- Right Column -->
  <rect x="280" y="130" width="30" height="180" rx="8" fill="url(#blueGrad)" filter="url(#shadow)" />

  <!-- Upward Trend Line & Arrow -->
  <line x1="195" y1="240" x2="345" y2="90" stroke="#ffffff" stroke-width="10" stroke-linecap="round" filter="url(#glow)" />
  <line x1="195" y1="240" x2="345" y2="90" stroke="#ffffff" stroke-width="10" stroke-linecap="round" />
  
  <!-- Trend Line Nodes -->
  <circle cx="195" cy="240" r="10" fill="#ffffff" stroke="#2563eb" stroke-width="4" />
  <circle cx="245" cy="190" r="10" fill="#ffffff" stroke="#2563eb" stroke-width="4" />
  <circle cx="295" cy="130" r="10" fill="#ffffff" stroke="#2563eb" stroke-width="4" />
  
  <!-- Glowing arrowhead -->
  <path d="M 315 90 L 345 90 L 345 120" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
</svg>
