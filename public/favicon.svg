<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Subtle depth) -->
    <radialGradient id="bgDepth" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Blue Brand Gradient (Glowing high-tech) -->
    <linearGradient id="blueGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Silver Metallic Gradient for Monogram -->
    <linearGradient id="silverGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="40%" stop-color="#cbd5e1" />
      <stop offset="70%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Glow Effect filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- Subtle Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background block to give a high-tech round icon appearance -->
  <rect width="512" height="512" rx="110" fill="url(#bgDepth)" />

  <!-- Outer circular glowing arc (representing analysis orbit) -->
  <path d="M 125 285 A 160 160 0 1 1 387 285" fill="none" stroke="url(#blueGrad)" stroke-width="22" stroke-linecap="round" filter="url(#glow)" />
  <path d="M 125 285 A 160 160 0 1 1 387 285" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.3" />

  <!-- The Bar Chart Columns -->
  <!-- Left Column -->
  <rect x="200" y="225" width="24" height="50" rx="6" fill="url(#blueGrad)" filter="url(#shadow)" />
  <!-- Middle Column -->
  <rect x="240" y="185" width="24" height="90" rx="6" fill="url(#blueGrad)" filter="url(#shadow)" />
  <!-- Right Column -->
  <rect x="280" y="140" width="24" height="135" rx="6" fill="url(#blueGrad)" filter="url(#shadow)" />

  <!-- Upward Trend Line & Arrow -->
  <line x1="212" y1="225" x2="332" y2="105" stroke="#ffffff" stroke-width="8" stroke-linecap="round" filter="url(#glow)" />
  <line x1="212" y1="225" x2="332" y2="105" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
  
  <!-- Trend Line Nodes -->
  <circle cx="212" cy="225" r="8" fill="#ffffff" stroke="#2563eb" stroke-width="3" />
  <circle cx="252" cy="185" r="8" fill="#ffffff" stroke="#2563eb" stroke-width="3" />
  <circle cx="292" cy="140" r="8" fill="#ffffff" stroke="#2563eb" stroke-width="3" />
  
  <!-- Glowing arrowhead -->
  <path d="M 308 105 L 332 105 L 332 129" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- K.A.S Monogram centered beautifully at the bottom half -->
  <text x="256" y="420" font-family="'Space Grotesk', 'Inter', system-ui, -apple-system, sans-serif" font-weight="900" font-size="110" letter-spacing="4" fill="url(#silverGrad)" text-anchor="middle" filter="url(#shadow)">K.A.S</text>
</svg>
